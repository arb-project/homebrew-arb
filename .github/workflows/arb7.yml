name: ARB 7

# Current release version does not build on recent macOS versions. Disable workflow.
on:
  # Disabled as the release version of ARB 7 does not build on recent macOS versions.
  # push:
  # schedule:
  #  - cron: "0 0 * * 1"
  workflow_dispatch:


jobs:
  build:
    name: Build ARB 7
    strategy:
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: install X11 server
      run: brew install --cask xquartz
    - name: untap aws - we don't need it
      run: brew untap aws/tap || true
    - name: untap broken HashiCorp tap
      run: brew untap hashicorp/tap || true
    - name: add current checkout as tap
      run: |
        brew tap arb-project/arb "$GITHUB_WORKSPACE"
    - name: trust our tap
      run: brew trust --tap arb-project/arb
    - name: install other ARB dependencies
      env:
        HOMEBREW_NO_INSTALL_FROM_API: 1
      run: brew install --only-dependencies arb-project/arb/arb@7
    - name: build HEAD version of ARB
      env:
        HOMEBREW_LOGS: /tmp/.homebrew-logs
        HOMEBREW_NO_INSTALL_FROM_API: 1
      run: brew install --keep-tmp arb-project/arb/arb@7
    - name: save Homebrew logs
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: Homebrew logs
        path: /tmp/.homebrew-logs/
        include-hidden-files: true
